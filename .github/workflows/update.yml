name: Actualizar picks y publicar

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

# Una corrida a la vez: la siguiente espera a que termine la anterior.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # El estado (historial, picks) vive en la rama "state", que se
      # sobrescribe en cada corrida para que el repo no crezca.
      - name: Traer estado
        run: |
          mkdir -p data site/cutouts
          git fetch origin state --depth=1 && git --work-tree=data checkout origin/state -- . || echo "Sin estado previo"
          git fetch origin cutouts --depth=1 && git --work-tree=site/cutouts checkout origin/cutouts -- . || echo "Sin recortes todavía"
          git reset -q
          ls -la data || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # web-push (para las notificaciones), instalado aparte y con caché
      - uses: actions/cache@v4
        with:
          path: ~/.cache/push-node
          key: push-node-v1
      - name: Instalar web-push
        run: |
          mkdir -p ~/.cache/push-node && cd ~/.cache/push-node
          [ -d node_modules/web-push ] || npm install --no-audit --no-fund web-push@3.6.7

      # El estado guardado va cifrado (el repositorio es público).
      - name: Abrir estado
        env:
          STATE_SECRET: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/vault.js open-state data

      - name: Actualizar partidos y picks
        env:
          FIRESTORE_BOT_KEY: ${{ secrets.FIRESTORE_BOT_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          NODE_PATH: /home/runner/.cache/push-node/node_modules
        run: node scripts/update.js

      # Sitio solo para miembros: los datos se publican cifrados y la llave
      # está en Firestore (solo la leen cuentas con acceso vigente).
      - name: Cifrar datos del sitio
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: node scripts/vault.js seal-site

      - name: Guardar estado
        env:
          STATE_SECRET: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node scripts/vault.js seal-state data state-out
          cd state-out
          git init -q -b state
          git config user.name "camilorey-bot"
          git config user.email "camilorey-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "estado $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      # Número de versión en los archivos: el navegador descarga siempre la
      # versión recién publicada en vez de una copia vieja.
      - name: Marcar versión
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          sed -i "s/__V__/${GITHUB_SHA::8}/g" site/index.html site/js/*.js
          # Llave de Gemini para el chat (si no está el secreto, el chat
          # funciona sin IA: los mensajes le llegan al admin).
          [ -n "$GEMINI_KEY" ] && sed -i "s/__GEMINI_KEY__/${GEMINI_KEY}/" site/js/config.js || true

      - uses: actions/configure-pages@v5
      - id: art
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Publicar con una versión ÚNICA por corrida. Desde el 04-nov-2026
      # GitHub Pages ignora (da "success" sin publicar) una publicación con
      # la misma versión que la anterior, y deploy-pages usa el commit, que
      # no cambia entre corridas: el sitio se quedó congelado ~19 h.
      - name: Publicar (versión única)
        id: pub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ART: ${{ steps.art.outputs.artifact_id }}
        run: |
          set -e
          VER="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [ -n "$ART" ] || ART=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" | jq -r '.artifacts[0].id')
          echo "paquete: $ART"
          OIDC=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "token OIDC: ${#OIDC} caracteres"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments"
          R=$(jq -n --argjson a "$ART" --arg v "$VER" --arg o "$OIDC" '{artifact_id:$a, pages_build_version:$v, oidc_token:$o}' \
            | curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" -d @-)
          ID=$(echo "$R" | jq -r '.id // empty')
          [ -n "$ID" ] || { echo "No se creó la publicación: $R"; exit 1; }
          echo "Publicación $ID (versión $VER)"
          for i in $(seq 1 60); do
            sleep 5
            S=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/$ID" | jq -r .status)
            echo "estado: $S"
            case "$S" in
              succeed) exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost|deployment_perms_error|deployment_attempt_error) exit 1 ;;
            esac
          done
          exit 1

      # Respaldo: si la publicación directa falla, la acción oficial.
      - id: deploy
        if: steps.pub.outcome != 'success'
        uses: actions/deploy-pages@v4

      # Historial viejo (2026 completo) DESPUÉS de publicar: así los
      # resultados y picks nuevos no esperan esta carga.
      - name: Cargar historial pendiente
        continue-on-error: true
        run: node scripts/update.js --history

      - name: Guardar estado (historial)
        env:
          STATE_SECRET: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node scripts/vault.js seal-state data state-out
          cd state-out
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "estado (historial) $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
