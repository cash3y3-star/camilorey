name: Cargar historial (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Días hacia atrás'
        default: '45'

permissions:
  contents: write

# Comparte grupo con la actualización normal: nunca corren a la vez.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Traer estado
        run: |
          mkdir -p data
          git fetch origin state --depth=1 && git --work-tree=data checkout origin/state -- . || echo "Sin estado previo"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cargar historial
        run: node scripts/update.js --backfill ${{ inputs.days }}
      - name: Guardar estado
        run: |
          cd data
          git init -q -b state
          git config user.name "camilorey-bot"
          git config user.email "camilorey-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "estado (historial) $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
