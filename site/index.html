    // Android/Chrome avisa que se puede instalar muy temprano: se guarda el
    // aviso para el botón "Instalar app" de app.js.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.crInstallEvt = e;
      window.crOnInstallable && window.crOnInstallable();
    });
    // Tema antes de pintar (evita parpadeo): oscuro por defecto.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('cr_theme') || 'dark'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);

  <!-- Pantalla de carga (Halloween): imagen + movimiento. Va en línea para
       pintarse antes que el resto; app.js la cierra con crSplashDone(). -->
  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; background: #050a18; overflow: hidden; transition: opacity .7s ease, visibility .7s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash .sp-blur { position: absolute; inset: -60px; background: url(img/splash.webp) center/cover; filter: blur(30px) brightness(.42) saturate(1.2); }
    #splash .sp-col { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: min(2.4vh, 18px); padding-bottom: env(safe-area-inset-bottom); }
    #splash .sp-stage { position: relative; flex: none; width: min(100vw, 76vh); aspect-ratio: 1233 / 1276; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 3%, #000 95%, transparent), linear-gradient(90deg, transparent, #000 2.5%, #000 97.5%, transparent); -webkit-mask-composite: source-in; mask-image: linear-gradient(transparent, #000 3%, #000 95%, transparent), linear-gradient(90deg, transparent, #000 2.5%, #000 97.5%, transparent); mask-composite: intersect; }
    @media (max-aspect-ratio: 3/4) { #splash .sp-stage { -webkit-mask-image: linear-gradient(transparent, #000 3%, #000 95%, transparent); -webkit-mask-composite: source-over; mask-image: linear-gradient(transparent, #000 3%, #000 95%, transparent); mask-composite: add; } }
    #splash .sp-zoom { position: absolute; inset: 0; animation: sp-zoom 9s ease-in-out infinite alternate; transform-origin: 50% 40%; }
    #splash .sp-img { position: absolute; inset: 0; background: url(img/splash.webp) center/100% 100%; }
    #splash .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; pointer-events: none; transform: translate(-50%, -50%); }
    #splash .moon { left: 61.6%; top: 12.2%; width: 42%; aspect-ratio: 1; background: radial-gradient(circle, rgba(150,195,255,0) 42%, rgba(150,195,255,.42) 50%, rgba(120,170,255,.12) 62%, transparent 72%); animation: sp-pulse 5s ease-in-out infinite; }
    #splash .orb { left: 20.1%; top: 26.7%; width: 27%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,50,30,.1) 30%, rgba(255,40,20,.72) 48%, rgba(255,30,10,.2) 60%, transparent 72%); animation: sp-pulse 2.2s ease-in-out infinite; }
    #splash .tw { width: 3.4%; aspect-ratio: 1; background: radial-gradient(circle, #fff 4%, rgba(255,215,130,.9) 16%, rgba(255,170,60,.3) 42%, transparent 70%); animation: sp-tw var(--d, 2s) ease-in-out var(--w, 0s) infinite; }
    #splash .star { left: 14.2%; top: 14%; width: 16%; aspect-ratio: 1; background: conic-gradient(from 0deg, transparent 0 7%, rgba(255,226,140,.8) 12.5%, transparent 18% 32%, rgba(255,226,140,.8) 37.5%, transparent 43% 57%, rgba(255,226,140,.8) 62.5%, transparent 68% 82%, rgba(255,226,140,.8) 87.5%, transparent 93%); -webkit-mask-image: radial-gradient(circle, #000 8%, transparent 68%); mask-image: radial-gradient(circle, #000 8%, transparent 68%); animation: sp-spin 7s linear infinite, sp-pulse 2.6s ease-in-out infinite; }
    #splash .win { width: 7%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,190,90,.75), rgba(255,130,30,.2) 45%, transparent 70%); animation: sp-flick 1.7s infinite; }
    #splash .shine { position: absolute; inset: 0; background: linear-gradient(112deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%) no-repeat; background-size: 260% 100%; -webkit-mask: url(img/splash-brillo.webp) center/100% 100%; mask: url(img/splash-brillo.webp) center/100% 100%; animation: sp-shine2 4.2s ease-in-out infinite; }
    #splash .crown { position: absolute; left: 29.6%; top: 11%; width: 15%; height: 9%; background: linear-gradient(112deg, transparent 42%, rgba(255,245,200,.85) 50%, transparent 58%) no-repeat; background-size: 300% 100%; mix-blend-mode: screen; border-radius: 40%; animation: sp-shine2 4.2s ease-in-out -1.4s infinite; }
    #splash .spark { position: absolute; left: var(--x); top: 31%; width: .75%; aspect-ratio: 1; border-radius: 50%; background: #ffb060; box-shadow: 0 0 6px 2px rgba(255,70,20,.85); opacity: 0; animation: sp-spark var(--d, 2.6s) ease-out var(--w, 0s) infinite; }
    #splash .fall { position: absolute; left: -25%; top: 3.6%; width: 13%; height: .35%; border-radius: 99px; background: linear-gradient(90deg, transparent, #fff); transform: rotate(13deg); opacity: 0; animation: sp-fall 7s linear 1s infinite; }
    #splash .fl { position: absolute; top: -3vh; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: var(--o); animation: sp-snow var(--d) linear var(--w) infinite; will-change: transform; }
    #splash .sp-foot { position: relative; flex: none; width: min(86vw, 460px); text-align: center; z-index: 2; }
    #splash .sp-load { font: 600 clamp(26px, 4.4vh, 40px)/1 Teko, Impact, sans-serif; letter-spacing: .05em; transform: skewX(-11deg); color: #f0f0f2; text-shadow: 0 2px 10px #000; }
    #splash .sp-lema { margin-top: 6px; font: 500 clamp(10px, 1.5vh, 13px)/1.5 system-ui, sans-serif; letter-spacing: .2em; color: #e6e2de; text-shadow: 0 1px 6px #000; }
    #splash .bar { position: relative; width: 100%; height: 10px; margin-top: min(1.8vh, 14px); border-radius: 99px; background: #3a3a3c; overflow: hidden; }
    #splash .bar i { position: absolute; inset: 0; width: var(--p, 8%); border-radius: inherit; background: linear-gradient(90deg, #8a0000, #ff1717 70%, #ff8a6a); box-shadow: 0 0 10px 2px rgba(255,23,23,.7); transition: width .5s ease-out; }
    #splash .bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sp-shine 1.2s linear infinite; }
    @keyframes sp-zoom { from { transform: scale(1); } to { transform: scale(1.035); } }
    @keyframes sp-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes sp-tw { 0%, 100% { opacity: .12; transform: translate(-50%, -50%) scale(.6); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }
    @keyframes sp-spin { from { transform: translate(-50%, -50%) rotate(0); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes sp-flick { 0%, 100% { opacity: .85; } 22% { opacity: .5; } 48% { opacity: 1; } 70% { opacity: .62; } }
    @keyframes sp-shine2 { 0%, 18% { background-position: 130% 0; } 70%, 100% { background-position: -40% 0; } }
    @keyframes sp-spark { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 10px), -19vmin) scale(.25); } }
    @keyframes sp-fall { 0%, 72% { opacity: 0; left: -25%; } 74% { opacity: 1; } 84%, 100% { opacity: 0; left: 62%; } }
    @keyframes sp-snow { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(var(--dx), 108vh, 0); } }
    @keyframes sp-shine { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
  </style>

  <script>
    // La barra avanza sola hasta ~90% mientras carga; crSplashDone() la
    // llena y cierra la pantalla (se ve al menos 1.8 s). Si algo falla, se
    // cierra sola a los 12 s.
    (function () {
      var t0 = Date.now(), p = 8, closed = false;
      var bar = document.getElementById('splash-bar');
      var sp = document.getElementById('splash'), nf = innerWidth < 700 ? 34 : 60;
      for (var f = 0; f < nf; f++) {
        var fl = document.createElement('i'), z = Math.random(); fl.className = 'fl';
        fl.style.cssText = '--x:' + Math.random() * 100 + '%;--s:' + (2 + z * 4) + 'px;--o:' + (.35 + z * .6) + ';--d:' + (9 - z * 4.5) + 's;--w:-' + Math.random() * 9 + 's;--dx:' + (Math.random() * 60 - 30) + 'px';
        sp.appendChild(fl);
      }
      var tick = setInterval(function () {
        p += (90 - p) * 0.08;
        bar.style.setProperty('--p', p + '%');
      }, 200);
      window.crSplashDone = function () {
        if (closed) return;
        closed = true;
        setTimeout(function () {
          clearInterval(tick);
          bar.style.setProperty('--p', '100%');
          setTimeout(function () {
            var s = document.getElementById('splash');
            s.classList.add('out');
            setTimeout(function () { s.remove(); }, 800);
          }, 500);
        }, Math.max(0, 1800 - (Date.now() - t0)));
      };
      setTimeout(window.crSplashDone, 12000);
    })();
  </script>
