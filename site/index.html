  <!-- Pantalla de carga (Halloween): imagen + movimiento. Va en línea para

  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; background: #050304; overflow: hidden; transition: opacity .7s ease, visibility .7s; }

    #splash .sp-blur { position: absolute; inset: -40px; background: url(img/splash.webp) center/cover; filter: blur(28px) brightness(.45); }
    #splash .sp-stage { position: absolute; left: 50%; top: 50%; width: max(100vw, 83.25vh); aspect-ratio: 1024 / 1230; transform: translate(-50%, -50%); overflow: hidden; }
    @media (min-aspect-ratio: 5/6) { #splash .sp-stage { width: auto; height: 100vh; } }
    #splash .sp-img { position: absolute; inset: 0; background: url(img/splash.webp) center/100% 100%; }
    #splash .sp-zoom { position: absolute; inset: 0; animation: sp-zoom 9s ease-in-out infinite alternate; transform-origin: 50% 35%; }
    #splash .mouth, #splash .jaw { position: absolute; inset: 0; pointer-events: none; }
    #splash .mouth { background: #ff9a2a; opacity: 0; animation: sp-mouth 3.2s infinite; }
    #splash .jaw { background: url(img/splash.webp) center/100% 100%; animation: sp-laugh 3.2s infinite; }
    @keyframes sp-laugh { 0%, 46%, 100% { transform: none; } 6%, 18%, 30% { transform: translate(.1%, var(--o)); } 12%, 24%, 36% { transform: translate(-.1%, calc(var(--o) * .15)); } 40% { transform: translateY(var(--o)); } }
    @keyframes sp-mouth { 0%, 46%, 100% { opacity: 0; } 3%, 43% { opacity: 1; } 6%, 18%, 30%, 40% { background: #ffd060; } }
    #splash .sp-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(#050304, transparent 6%, transparent 94%, #050304); }
    #splash .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; pointer-events: none; transform: translate(-50%, -50%); }
    #splash .orb { left: 49.8%; top: 32.5%; width: 58%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,40,20,.0) 38%, rgba(255,30,10,.55) 46%, rgba(255,20,0,.18) 56%, transparent 68%); animation: sp-orb 2.4s ease-in-out infinite; }
    #splash .core { left: 49.8%; top: 30%; width: 34%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,60,40,.35), transparent 65%); animation: sp-orb 2.4s ease-in-out infinite reverse; }
    #splash .fire { width: 7%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,190,90,.95), rgba(255,90,20,.45) 35%, transparent 70%); animation: sp-flick 1.3s infinite; }
    #splash .pump { width: 22%; aspect-ratio: 1.5; background: radial-gradient(ellipse, rgba(255,140,30,.6), rgba(255,60,0,.2) 45%, transparent 70%); animation: sp-pump 3.2s infinite; }
    #splash .eyes { left: 29.5%; top: 10.4%; width: 12%; aspect-ratio: 2; background: radial-gradient(ellipse, rgba(255,0,0,.9), rgba(255,0,0,.25) 40%, transparent 70%); animation: sp-eyes 3.5s infinite; }
    #splash .moon { left: 73.5%; top: 5.8%; width: 26%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,240,230,.22) 35%, transparent 65%); animation: sp-moon 6s ease-in-out infinite; }
    #splash .fog { position: absolute; left: -50%; width: 200%; height: 22%; background: radial-gradient(ellipse at 25% 50%, rgba(200,40,30,.22), transparent 55%), radial-gradient(ellipse at 70% 60%, rgba(255,255,255,.08), transparent 50%); filter: blur(10px); pointer-events: none; }
    #splash .fog.f1 { top: 62%; animation: sp-fog 16s linear infinite; }
    #splash .fog.f2 { top: 76%; animation: sp-fog 24s linear infinite reverse; opacity: .8; }
    #splash .bat { position: absolute; width: 7%; fill: #000; filter: drop-shadow(0 0 4px rgba(255,30,0,.45)); offset-rotate: 0deg; }
    #splash .bat svg { width: 100%; animation: sp-flap .22s ease-in-out infinite alternate; transform-origin: 50% 40%; }
    #splash .b1 { animation: sp-bat1 7s linear infinite; }
    #splash .b2 { animation: sp-bat2 9s linear 2s infinite; width: 5%; }
    #splash .b3 { animation: sp-bat3 11s linear 4.5s infinite; width: 4%; }
    #splash .ember { position: absolute; bottom: 8%; width: .6%; aspect-ratio: 1; border-radius: 50%; background: #ff5a2a; box-shadow: 0 0 6px 2px rgba(255,60,0,.8); opacity: 0; animation: sp-ember var(--d, 5s) linear var(--w, 0s) infinite; }
    #splash .bar { position: absolute; left: 28.5%; top: 95.2%; width: 43%; height: 1.15%; border-radius: 99px; background: #3a3a3c; overflow: hidden; }
    #splash .bar i { position: absolute; inset: 0; width: var(--p, 8%); border-radius: inherit; background: linear-gradient(90deg, #8a0000, #ff1717 70%, #ff8a6a); box-shadow: 0 0 10px 2px rgba(255,23,23,.7); transition: width .5s ease-out; }
    #splash .bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sp-shine 1.2s linear infinite; }
    @keyframes sp-zoom { from { transform: scale(1); } to { transform: scale(1.05); } }
    @keyframes sp-orb { 0%, 100% { opacity: .55; transform: translate(-50%, -50%) scale(.97); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); } }
    @keyframes sp-flick { 0%, 100% { opacity: .9; transform: translate(-50%, -50%) scale(1); } 20% { opacity: .55; transform: translate(-52%, -48%) scale(.85); } 45% { opacity: 1; transform: translate(-49%, -52%) scale(1.12); } 70% { opacity: .7; transform: translate(-51%, -50%) scale(.95); } }
    @keyframes sp-pump { 0%, 46%, 100% { opacity: .45; } 6%, 18%, 30%, 40% { opacity: 1; } 12%, 24%, 36% { opacity: .6; } }
    @keyframes sp-eyes { 0%, 40%, 100% { opacity: .35; } 48%, 70% { opacity: 1; } 52% { opacity: .2; } }
    @keyframes sp-moon { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes sp-fog { from { transform: translateX(0); } to { transform: translateX(25%); } }
    @keyframes sp-flap { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }
    @keyframes sp-bat1 { 0% { left: -10%; top: 20%; } 25% { top: 12%; } 50% { top: 18%; } 75% { top: 8%; } 100% { left: 110%; top: 14%; } }
    @keyframes sp-bat2 { 0% { left: 110%; top: 6%; transform: scaleX(-1); } 50% { top: 14%; } 100% { left: -10%; top: 3%; transform: scaleX(-1); } }
    @keyframes sp-bat3 { 0% { left: -8%; top: 30%; } 40% { top: 22%; } 100% { left: 108%; top: 4%; } }
    @keyframes sp-ember { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x, 20px), -60vh) scale(.3); } }
    @keyframes sp-shine { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
  </style>

  <script>
    // La barra avanza sola hasta ~90% mientras carga; crSplashDone() la
    // llena y cierra la pantalla (se ve al menos 1.8 s). Si algo falla, se
    // cierra sola a los 12 s.
    (function () {
      var t0 = Date.now(), p = 8, closed = false;
      var bar = document.getElementById('splash-bar');
      var tick = setInterval(function () {
        p += (90 - p) * 0.08;
        bar.style.setProperty('--p', p + '%');
      }, 200);
      window.crSplashDone = function () {
        if (closed) return;
        closed = true;
        setTimeout(function () {
          clearInterval(tick);
          bar.style.setProperty('--p', '100%');
          setTimeout(function () {
            var s = document.getElementById('splash');
            s.classList.add('out');
            setTimeout(function () { s.remove(); }, 800);
          }, 500);
        }, Math.max(0, 1800 - (Date.now() - t0)));
      };
      setTimeout(window.crSplashDone, 12000);
    })();
  </script>
