    // Android/Chrome avisa que se puede instalar muy temprano: se guarda el
    // aviso para el botón "Instalar app" de app.js.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.crInstallEvt = e;
      window.crOnInstallable && window.crOnInstallable();
    });
    // Tema antes de pintar (evita parpadeo): oscuro por defecto.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('cr_theme') || 'dark'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();

<body>
  <!-- Pantalla de carga (Halloween): imagen + movimiento. Va en línea para
       pintarse antes que el resto; app.js la cierra con crSplashDone(). -->
  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; background: #070c1c; overflow: hidden; transition: opacity .7s ease, visibility .7s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash .sp-blur { position: absolute; inset: -60px; background: url(img/splash.webp) center/cover; filter: blur(30px) brightness(.4) saturate(1.2); }
    #splash .sp-stage { position: absolute; left: 50%; top: 50%; width: max(100vw, 49.7vh); aspect-ratio: 1233 / 2480; transform: translate(-50%, -50%); overflow: hidden; }
    @media (min-aspect-ratio: 1233/2480) { #splash .sp-stage { width: 49.7vh; } }
    #splash .sp-zoom { position: absolute; inset: 0; animation: sp-zoom 9s ease-in-out infinite alternate; transform-origin: 50% 55%; }
    #splash .sp-img { position: absolute; inset: 0; width: 100%; height: 100%; }
    #splash .sp-img { background: url(img/splash.webp) center/100% 100%; }
    #splash .glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; pointer-events: none; transform: translate(-50%, -50%); }
    #splash .moon { left: 73%; top: 53.6%; width: 78%; aspect-ratio: 1; background: radial-gradient(circle, rgba(150,195,255,0) 44%, rgba(150,195,255,.38) 50%, rgba(120,170,255,.12) 60%, transparent 70%); animation: sp-pulse 4s ease-in-out infinite; }
    #splash .orb { left: 20.1%; top: 54%; width: 27%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,50,30,.1) 30%, rgba(255,40,20,.8) 48%, rgba(255,30,10,.2) 60%, transparent 72%); animation: sp-pulse 1.8s ease-in-out infinite; }
    #splash .tw { width: 3.8%; aspect-ratio: 1; background: radial-gradient(circle, #fff 4%, rgba(255,215,130,.9) 16%, rgba(255,170,60,.3) 42%, transparent 70%); animation: sp-tw var(--d, 2s) ease-in-out var(--w, 0s) infinite; }
    #splash .star { left: 14.2%; top: 47.4%; width: 18%; aspect-ratio: 1; background: conic-gradient(from 0deg, transparent 0 7%, rgba(255,226,140,.85) 12.5%, transparent 18% 32%, rgba(255,226,140,.85) 37.5%, transparent 43% 57%, rgba(255,226,140,.85) 62.5%, transparent 68% 82%, rgba(255,226,140,.85) 87.5%, transparent 93%); -webkit-mask-image: radial-gradient(circle, #000 8%, transparent 68%); mask-image: radial-gradient(circle, #000 8%, transparent 68%); animation: sp-spin 6s linear infinite; }
    #splash .win { width: 7%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255,190,90,.75), rgba(255,130,30,.2) 45%, transparent 70%); animation: sp-flick 1.7s infinite; }
    #splash .txt { position: absolute; left: 18.98%; top: 12.1%; width: 62%; aspect-ratio: 620 / 703; animation: sp-float 3.4s ease-in-out infinite alternate; }
    #splash .txt img { display: block; width: 100%; height: 100%; }
    #splash .shine { position: absolute; inset: 0; background: linear-gradient(112deg, transparent 44%, rgba(255,255,255,.98) 50%, transparent 56%) no-repeat; background-size: 280% 100%; -webkit-mask: url(img/splash-brillo.webp) center/100% 100%; mask: url(img/splash-brillo.webp) center/100% 100%; animation: sp-shine2 3s ease-in-out infinite; }
    #splash .spark { position: absolute; left: var(--x); top: 58.2%; width: .8%; aspect-ratio: 1; border-radius: 50%; background: #ffb060; box-shadow: 0 0 6px 2px rgba(255,70,20,.85); opacity: 0; animation: sp-spark var(--d, 2.2s) ease-out var(--w, 0s) infinite; }
    #splash .trn { position: absolute; left: 0; top: 0; width: 42%; opacity: 0; animation: sp-trn 5.5s linear infinite; filter: drop-shadow(0 0 3px rgba(190,220,255,.6)); }
    #splash .fl { position: absolute; top: -3vh; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: var(--o); animation: sp-snow var(--d) linear var(--w) infinite; will-change: transform; }
    #splash .sp-foot { position: absolute; left: 50%; bottom: max(2.4vh, 12px); width: min(78vw, 420px); transform: translateX(-50%); text-align: center; z-index: 2; }
    #splash .sp-load { font: 600 clamp(24px, 3.7vh, 36px)/1 Teko, Impact, sans-serif; letter-spacing: .06em; transform: skewX(-11deg); color: #f4f4f5; text-shadow: 0 2px 8px #000, 0 0 16px #000; }
    #splash .bar { position: relative; width: 100%; height: 8px; margin-top: 6px; border-radius: 99px; background: #3a3a3c; overflow: hidden; box-shadow: 0 0 8px #000; }
    #splash .bar i { position: absolute; inset: 0; width: var(--p, 8%); border-radius: inherit; background: linear-gradient(90deg, #8a0000, #ff1717 70%, #ff8a6a); box-shadow: 0 0 10px 2px rgba(255,23,23,.7); transition: width .5s ease-out; }
    #splash .bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sp-shine 1.2s linear infinite; }
    @keyframes sp-float { from { transform: translateY(-1.3%); } to { transform: translateY(1.3%); } }
    @keyframes sp-zoom { from { transform: scale(1); } to { transform: scale(1.03); } }
    @keyframes sp-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes sp-tw { 0%, 100% { opacity: .12; transform: translate(-50%, -50%) scale(.6); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }
    @keyframes sp-spin { from { transform: translate(-50%, -50%) rotate(0); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes sp-flick { 0%, 100% { opacity: .85; } 22% { opacity: .5; } 48% { opacity: 1; } 70% { opacity: .62; } }
    @keyframes sp-shine2 { 0%, 12% { background-position: 130% 0; } 72%, 100% { background-position: -40% 0; } }
    @keyframes sp-spark { 0% { opacity: 0; transform: translate(0, 0) scale(1); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 10px), -22vmin) scale(.25); } }
    @keyframes sp-trn { 0% { opacity: 0; transform: translate(95%, 450%) rotate(0deg); } 8% { opacity: 1; } 25% { transform: translate(120%, 425%) rotate(-2deg); } 50% { transform: translate(150%, 435%) rotate(2deg); } 75% { transform: translate(185%, 400%) rotate(-2deg); } 92% { opacity: 1; } 100% { opacity: 0; transform: translate(245%, 385%) rotate(0deg); } }
    @keyframes sp-snow { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(var(--dx), 108vh, 0); } }
    @keyframes sp-shine { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
  </style>

      <div class="txt"><img src="img/splash-texto.webp" alt=""><div class="shine"></div></div>
      <i class="spark" style="--x:16%;--d:2s;--dx:-14px"></i>
      <i class="spark" style="--x:19%;--d:2.5s;--w:.5s;--dx:10px"></i>
      <i class="spark" style="--x:21%;--d:2.2s;--w:1.1s;--dx:-6px"></i>
      <i class="spark" style="--x:24%;--d:2.6s;--w:1.6s;--dx:16px"></i>
      <img class="trn" src="img/splash-trineo.webp" alt="">
    </div></div>
    <div class="sp-foot">
      <div class="sp-load">CARGANDO...</div>
      <div class="bar"><i id="splash-bar"></i></div>
    </div>
  </div>
  <script>
    // La barra avanza sola hasta ~90% mientras carga; crSplashDone() la
    // llena y cierra la pantalla (se ve al menos 1.8 s). Si algo falla, se
    // cierra sola a los 12 s.
    (function () {
      var t0 = Date.now(), p = 8, closed = false;
      var bar = document.getElementById('splash-bar');
      var sp = document.getElementById('splash'), nf = innerWidth < 700 ? 34 : 60;
      for (var f = 0; f < nf; f++) {
        var fl = document.createElement('i'), z = Math.random(); fl.className = 'fl';
        fl.style.cssText = '--x:' + Math.random() * 100 + '%;--s:' + (2 + z * 4) + 'px;--o:' + (.35 + z * .6) + ';--d:' + (9 - z * 4.5) + 's;--w:-' + Math.random() * 9 + 's;--dx:' + (Math.random() * 60 - 30) + 'px';
        sp.appendChild(fl);
      }
      var tick = setInterval(function () {
        p += (90 - p) * 0.08;
        bar.style.setProperty('--p', p + '%');
      }, 200);
      window.crSplashDone = function () {
        if (closed) return;
        closed = true;
        setTimeout(function () {
          clearInterval(tick);
          bar.style.setProperty('--p', '100%');
          setTimeout(function () {
            var s = document.getElementById('splash');
            s.classList.add('out');
            setTimeout(function () { s.remove(); }, 800);
          }, 500);
        }, Math.max(0, 1800 - (Date.now() - t0)));
      };
      setTimeout(window.crSplashDone, 12000);
    })();
  </script>
