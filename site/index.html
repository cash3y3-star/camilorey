  <script>
    // Android/Chrome avisa que se puede instalar muy temprano: se guarda el
    // aviso para el botón "Instalar app" de app.js.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.crInstallEvt = e;
      window.crOnInstallable && window.crOnInstallable();
    });
    // Tema antes de pintar (evita parpadeo): oscuro por defecto.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('cr_theme') || 'dark'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

</head>
<body>
  <!-- Pantalla de carga (Halloween): imagen + movimiento. Va en línea para
       pintarse antes que el resto; app.js la cierra con crSplashDone(). -->
  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; background: radial-gradient(ellipse 120% 75% at 50% 100%, #c40d12 0%, #6d0509 38%, #1c0204 72%, #050304 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .7s ease, visibility .7s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash .sp-load { font: 600 clamp(38px, 7vh, 58px)/1 Teko, Impact, sans-serif; letter-spacing: .06em; transform: skewX(-11deg); color: #f4f4f5; text-shadow: 0 2px 14px rgba(0,0,0,.7); animation: sp-pulse 1.6s ease-in-out infinite; }
    #splash .bar { position: relative; width: min(70vw, 340px); height: 8px; margin-top: 14px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
    #splash .bar i { position: absolute; inset: 0; width: var(--p, 8%); border-radius: inherit; background: linear-gradient(90deg, #ff1717, #fff); box-shadow: 0 0 10px 2px rgba(255,23,23,.7); transition: width .5s ease-out; }
    @keyframes sp-pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
  </style>
  <div id="splash" role="status" aria-label="Cargando">
    <div class="sp-load">CARGANDO...</div>
    <div class="bar"><i id="splash-bar"></i></div>
  </div>
  <script>
    // La barra avanza sola hasta ~90% mientras carga; crSplashDone() la
    // llena y cierra la pantalla (se ve al menos 1.8 s). Si algo falla, se
    // cierra sola a los 12 s.
    (function () {
      var t0 = Date.now(), p = 8, closed = false;
      var bar = document.getElementById('splash-bar');
      var tick = setInterval(function () {
        p += (90 - p) * 0.08;
        bar.style.setProperty('--p', p + '%');
      }, 200);
      window.crSplashDone = function () {
        if (closed) return;
        closed = true;
        setTimeout(function () {
          clearInterval(tick);
          bar.style.setProperty('--p', '100%');
          setTimeout(function () {
            var s = document.getElementById('splash');
            s.classList.add('out');
            setTimeout(function () { s.remove(); }, 800);
          }, 500);
        }, Math.max(0, 1800 - (Date.now() - t0)));
      };
      setTimeout(window.crSplashDone, 12000);
    })();
  </script>
